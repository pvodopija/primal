; Halo (Alif Balletto B1): Ethos-U55 with 128 MACs/cycle, 160 MHz core, 2 MB SRAM,
; 1.8 MB MRAM. SRAM and MRAM timings are estimates, not datasheet values: two memory
; modes bracket the answer, weights copied into SRAM (fast) or read from MRAM (slower).

[System_Config.Alif_B1]
core_clock=160e6
axi0_port=Sram
axi1_port=OffChipFlash
Sram_clock_scale=1.0
Sram_burst_length=32
Sram_read_latency=32
Sram_write_latency=32
OffChipFlash_clock_scale=0.5
OffChipFlash_burst_length=32
OffChipFlash_read_latency=64
OffChipFlash_write_latency=64

; weights and activations all in SRAM
[Memory_Mode.Sram_Only]
const_mem_area=Axi0
arena_mem_area=Axi0
cache_mem_area=Axi0

; weights stay in MRAM, activations in SRAM
[Memory_Mode.Shared_Sram]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0
