; Vela system config for the Alif Balletto B1 in Halo.
;
; B1 has no bulk SRAM outside the M55-HE TCMs, so the tensor arena lives in
; DTCM and the weights stay in MRAM. Timing values are Alif's own, from
; scripts/vela/ensemble_vela.ini in alifsemi/alif_ml-embedded-evaluation-kit
; (Apache-2.0): DTCM from RTSS_HE_DTCM_Only, MRAM from RTSS_HE_SRAM_MRAM.
; 160 MHz matches CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC in halo_defconfig.

[System_Config.B1_HE_DTCM_MRAM]
core_clock=160e6
axi0_port=Sram
axi1_port=OffChipFlash
Sram_clock_scale=0.889
Sram_burst_length=32
Sram_read_latency=5
Sram_write_latency=5
OffChipFlash_clock_scale=0.303
OffChipFlash_burst_length=16
OffChipFlash_read_latency=24
OffChipFlash_write_latency=24

[Memory_Mode.Shared_Sram]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0
